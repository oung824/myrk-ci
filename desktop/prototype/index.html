<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Myrk · 白色界面样机</title>
<style>
:root{font:14px "Segoe UI","Microsoft YaHei",sans-serif;color:#252525;background:#fff;--nav:260px}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit;color:inherit}button{border:0;background:none;cursor:pointer;border-radius:7px}button:hover:not(:disabled){background:#eee}button:disabled{opacity:.4;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #888;outline-offset:3px}svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.55;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}[hidden]{display:none!important}h1,h2,p{margin:0}.app{height:100dvh;min-height:500px;display:grid;grid-template-columns:var(--nav) minmax(0,1fr);overflow:hidden}.sidebar{background:#fafafa;border-right:1px solid #e9e9e9;display:flex;flex-direction:column;min-height:0}.sidebar-head{height:49px;flex-shrink:0;display:flex;align-items:center;gap:14px;padding:0 15px}.icon{width:31px;height:31px;display:inline-flex;align-items:center;justify-content:center}.wordmark{font-size:17px;font-weight:600;letter-spacing:-.6px}.nav{padding:8px 9px}.nav-button{display:flex;align-items:center;gap:11px;width:100%;height:35px;padding:0 12px;text-align:left;font-size:13px;margin-bottom:3px}.nav-button.active{background:#e9e9e9}.search-box{margin:6px 12px 10px}.search-box input{width:100%;padding:8px 10px;border:1px solid #ddd;border-radius:7px;background:#fff;font-size:12px}.history-label{font-size:11px;color:#777;padding:23px 20px 9px}.sessions{flex:1;min-height:40px;overflow:auto;padding:0 9px}.session{display:block;width:100%;text-align:left;padding:9px 13px;margin:3px 0;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.session.active{background:#e5e5e5}.session:before{content:"";width:5px;height:5px;border:1px solid #bbb;display:inline-block;border-radius:50%;margin-right:11px;vertical-align:2px}.sidebar-foot{border-top:1px solid #e7e7e7;padding:11px 10px;display:flex;align-items:center;min-height:58px}.sidebar-foot button{display:flex;align-items:center;gap:10px;padding:7px 10px;font-size:12px}.local{font-size:10px;color:#aaa;margin-left:auto;padding-right:9px}.main{display:flex;flex-direction:column;min-width:0;min-height:0;background:#fff}.topbar{height:49px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid #f0f0f0;flex-shrink:0}.title{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sample{font-size:10px;color:#aaa;letter-spacing:.4px;white-space:nowrap}.conversation{flex:1;min-height:0;overflow:auto;padding:28px 45px 20px}.thread{max-width:770px;margin:auto}.user{display:flex;justify-content:flex-end;margin:5px 0 31px}.bubble{max-width:85%;padding:12px 17px;background:#f3f3f3;border-radius:15px 15px 4px 15px;font-size:13px;line-height:1.8;white-space:pre-wrap;overflow-wrap:anywhere}.answer{margin:0 0 31px}.answer-body{font-size:13px;line-height:1.95;white-space:pre-wrap;overflow-wrap:anywhere;color:#333}.answer-body h2{font-size:17px;font-weight:550;line-height:1.6;margin-bottom:14px}.quote{border-left:2px solid #ddd;margin:13px 0;padding:2px 14px;color:#777;font-size:12px}.source{display:inline-flex;align-items:center;gap:5px;color:#888;font-size:10px;padding:4px 7px;border:1px solid #e9e9e9;border-radius:5px;line-height:1.5}.source svg{width:12px;height:12px}.answer-tools{margin-top:8px;display:flex;align-items:center;gap:5px;color:#999}.answer-tools .icon{width:25px;height:25px}.answer-tools svg{width:13px;height:13px}.demo-text{font-size:9px;color:#aaa;margin-left:3px}.composer-region{flex-shrink:0;padding:14px 40px 77px}.composer-area{max-width:770px;margin:0 auto}.composer{border:1px solid #ddd;border-radius:17px;padding:11px 12px 9px;background:#fff;box-shadow:0 3px 14px #00000003}.composer textarea{display:block;width:100%;resize:none;min-height:39px;max-height:110px;line-height:1.65;font-size:13px;border:0;outline:none;padding:2px 5px;background:transparent}.composer textarea::placeholder{color:#aaa}.composer-bottom{display:flex;justify-content:space-between;align-items:center;gap:12px}.composer-right{display:flex;align-items:center;gap:10px}.model{font-size:10px;display:flex;gap:5px;align-items:center;color:#777;padding:5px 7px}.model svg{width:11px;height:11px}.send{height:29px;min-width:29px;border-radius:9px;background:#242424;color:white;display:flex;align-items:center;justify-content:center}.send:hover:not(:disabled){background:#4c4c4c}.send:disabled{opacity:1;background:#e8e8e8;color:#aaa}.send svg{width:17px;height:17px}.caption{display:flex;justify-content:space-between;gap:12px;font-size:10px;line-height:1.6;color:#aaa;margin:9px 5px 0}.attachment{display:flex;align-items:center;gap:8px;padding:7px 9px;margin:0 4px 10px;border:1px solid #e9e9e9;border-radius:8px;background:#fcfcfc;width:max-content;max-width:100%;font-size:11px;color:#777}.attachment svg{width:16px;height:16px}.attachment button{font-size:15px;color:#aaa;padding:0 3px;margin-left:8px}.welcome{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:0 45px 105px;overflow:auto}.welcome h1{font-size:32px;font-weight:400;letter-spacing:-1.6px;color:#353535;margin:0 0 34px;text-align:center;line-height:1.5}.welcome .composer-area{width:100%;max-width:660px}.welcome .composer{padding:13px 13px 10px;border-radius:18px}.welcome .composer textarea{min-height:55px}.welcome .caption{justify-content:center}.welcome-note{margin-top:25px;font-size:11px;color:#aaa;text-align:center;line-height:1.8}.preview-controls{position:fixed;z-index:20;bottom:14px;left:calc(50% + var(--nav)/2);transform:translateX(-50%);display:flex;align-items:center;gap:3px;border:1px solid #e4e4e4;border-radius:10px;padding:4px;background:#fff;box-shadow:0 4px 18px #0000000a;white-space:nowrap}.preview-controls>span{font-size:9px;color:#aaa;letter-spacing:1px;padding:0 7px}.preview-controls button{font-size:10px;color:#888;padding:7px 10px;border-radius:6px}.preview-controls button.selected{background:#303030;color:white}.toast{position:fixed;z-index:40;top:61px;left:calc(50% + var(--nav)/2);transform:translateX(-50%);border:1px solid #e0e0e0;border-radius:9px;background:white;box-shadow:0 4px 24px #0000000d;padding:10px 17px;color:#676767;font-size:12px;max-width:85%}.dialog{border:1px solid #ddd;border-radius:15px;padding:0;color:#333;width:430px;max-width:calc(100% - 35px);box-shadow:0 20px 100px #00000024}.dialog::backdrop{background:#00000029}.dialog-head{display:flex;justify-content:space-between;align-items:center;padding:17px 22px;border-bottom:1px solid #ededed}.dialog-head h2{font-size:16px;font-weight:550}.dialog-body{padding:23px}.field{margin-bottom:23px}.field label{display:block;font-size:12px;font-weight:550;margin-bottom:9px}.field input[type=number],.field select{width:100%;border:1px solid #ddd;background:white;border-radius:7px;padding:9px 10px;font-size:12px}.field p,.dialog-note{font-size:11px;color:#999;line-height:1.8;margin-top:8px}.field .check{display:flex;align-items:center;gap:9px;font-weight:400}.check input{accent-color:#555}.dialog-foot{padding:0 23px 23px;display:flex;justify-content:flex-end}.primary{background:#2b2b2b;color:#fff;padding:9px 22px;font-size:12px}.primary:hover{background:#494949!important}.document-content{font-size:12px;line-height:2;background:#fafafa;padding:15px;border-radius:8px}.collapsed{--nav:57px}.collapsed .sidebar-head{padding:0 13px}.collapsed .wordmark,.collapsed .nav-button span,.collapsed .history-label,.collapsed .sessions,.collapsed .local,.collapsed .sidebar-foot span,.collapsed .search-box{display:none}.collapsed .nav{padding:8px}.collapsed .nav-button{padding:0;justify-content:center}.collapsed .sidebar-foot{padding:11px 7px;margin-top:auto}.collapsed .sidebar-foot button{padding:8px 11px}.no-result{font-size:11px;color:#aaa;padding:12px}
@media(min-width:1500px){:root{--nav:280px}.conversation{padding-top:40px}.collapsed{--nav:57px}}
@media(max-width:850px){:root{--nav:215px}.conversation{padding:25px}.composer-region{padding:14px 23px 77px}.welcome{padding-left:27px;padding-right:27px}.welcome h1{font-size:27px}.topbar{padding:0 22px}.collapsed{--nav:57px}}
@media(max-width:600px){:root{--nav:57px}.sidebar-head{padding:0 13px}.wordmark,.nav-button span,.history-label,.sessions,.local,.sidebar-foot span,.search-box{display:none}.nav{padding:8px}.nav-button{padding:0;justify-content:center}.sidebar-foot{padding:11px 7px;margin-top:auto}.sidebar-foot button{padding:8px 11px}.topbar{padding:0 15px}.sample{font-size:9px}.conversation{padding:20px 19px}.composer-region{padding:12px 15px 80px}.welcome{padding:0 20px 75px}.welcome h1{font-size:25px;letter-spacing:-1px;margin-bottom:25px}.caption .hint{display:none}.caption{justify-content:center;font-size:9px}.preview-controls>span{display:none}.preview-controls button{font-size:9px}.model{font-size:9px}.bubble{max-width:95%}}
</style></head><body>
<div id="app" class="app"></div><div class="preview-controls" aria-label="样机页面切换"><span>布局预览</span><button data-view="new">新会话欢迎页</button><button data-view="chat">已有对话页</button></div><div id="toast" class="toast" role="status" hidden></div>
<dialog id="settings" class="dialog"><div class="dialog-head"><h2>设置</h2><button class="icon" data-close="settings" aria-label="关闭设置">×</button></div><div class="dialog-body"><div class="field"><label for="provider">回答服务</label><select id="provider"><option>DeepSeek（提供理解和回答的服务）</option></select><p>界面样机无需填写连接密码，不会调用真实服务。</p></div><div class="field"><label for="rounds">每次最多处理轮数</label><input id="rounds" type="number" min="1" max="100" value="10"><p>一次任务中，最多请模型决定多少次下一步。</p></div><div class="field"><label class="check"><input id="thinking" type="checkbox">额外思考</label><p>正式软件中可开启更深入的推理；这里仅演示开关位置。</p></div><p class="dialog-note">设置修改只用于查看界面，刷新后恢复默认。</p></div><div class="dialog-foot"><button class="primary" data-close="settings">完成</button></div></dialog>
<dialog id="document" class="dialog"><div class="dialog-head"><h2>资料摘录</h2><button class="icon" data-close="document" aria-label="关闭资料摘录">×</button></div><div class="dialog-body"><div class="document-content"><strong>办公用品采购规则（演示资料）</strong><br>生效日期：2026年11月1日<br><br>1. 单笔采购金额超过800元，需要负责人审批。<br>2. 单笔采购金额为800元或更少，无需审批。<br>3. 报销时必须提供发票。</div><p class="dialog-note">这些文字直接附在样机页面中，没有读取电脑文件。</p></div><div class="dialog-foot"><button class="primary" data-close="document">看完了</button></div></dialog>
<script>
const icons={panel:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M9 5v14"/>',plus:'<path d="M12 5v14M5 12h14"/>',search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/>',settings:'<path d="m10 3-1 3-3 1-3 3 2 2-1 4 3 2 3-1 3 3 3-2v-3l3-2-1-4-3-1-1-3z"/><circle cx="11" cy="12" r="3"/>',send:'<path d="M12 18V5m-5 5 5-5 5 5"/>',stop:'<rect x="7" y="7" width="10" height="10" rx="1" fill="currentColor" stroke="none"/>',file:'<path d="M6 3h8l4 4v14H6zM14 3v5h4M9 12h6M9 16h6"/>',copy:'<rect x="8" y="8" width="11" height="12" rx="2"/><path d="M15 8V4H4v12h4"/>',down:'<path d="m7 9 5 5 5-5"/>'};
const icon=name=>`<svg viewBox="0 0 24 24" aria-hidden="true">${icons[name]}</svg>`;
const escape=text=>text.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
const sessions=[{id:1,title:'你好',messages:[{role:'user',text:'你好'},{role:'assistant',text:'你好！有什么我可以帮你的吗？'}],attachment:false},{id:2,title:'采购规则问答',messages:[{role:'user',text:'请概括采购规则的三条重点，并引用依据。'},{role:'assistant',text:'超过800元需审批；800元及以下无需审批；报销须提供发票。生效日期：2026年11月1日。',source:true}],attachment:true}];
let current=null,nextId=3,draft='',query='',showSearch=false,collapsed=false,running=false,timer=null,toastTimer,hadAttachment=false;
const app=document.querySelector('#app');
function notify(text){const t=document.querySelector('#toast');t.textContent=text;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.hidden=true,2600)}
function sessionList(){return sessions.filter(s=>s.title.includes(query)).map(s=>`<button class="session ${current===s.id?'active':''}" data-session="${s.id}" ${running?'disabled':''} title="${escape(s.title)}">${escape(s.title)}</button>`).join('')||'<p class="no-result">没有找到会话</p>'}
function render(){
 const s=sessions.find(s=>s.id===current),attached=s?s.attachment:hadAttachment;document.body.classList.toggle('collapsed',collapsed);
 const composer=`<div class="composer-area"><div class="composer">${attached?`<div class="attachment">${icon('file')}采购规则 · 演示资料<button data-action="remove" aria-label="移除演示附件" ${running?'disabled':''}>×</button></div>`:''}<textarea rows="${s?'1':'2'}" aria-label="输入消息" placeholder="${s?'输入消息…':'输入消息，或添加一份资料…'}" ${running?'disabled':''}>${escape(draft)}</textarea><div class="composer-bottom"><button class="icon" data-action="attach" aria-label="添加演示附件" title="添加演示附件" ${running?'disabled':''}>${icon('plus')}</button><div class="composer-right"><button class="model" data-action="settings" aria-label="设置回答服务">DeepSeek（回答服务）${icon('down')}</button><button class="send" data-action="${running?'stop':'send'}" aria-label="${running?'停止演示':'发送消息'}" ${!running&&!draft.trim()?'disabled':''}>${icon(running?'stop':'send')}</button></div></div></div><div class="caption"><span id="run-status">${running?'正在演示回答 · 可随时停止':'演示内容，不联网、不读文件、不保存记录。'}</span>${s?'<span class="hint">Shift + 回车换行</span>':''}</div></div>`;
 app.innerHTML=`<aside class="sidebar"><div class="sidebar-head"><button class="icon" data-action="collapse" aria-label="收起或展开侧边栏">${icon('panel')}</button><span class="wordmark">Myrk</span></div><nav class="nav"><button class="nav-button ${!s?'active':''}" data-action="new" ${running?'disabled':''} aria-label="新建会话">${icon('plus')}<span>新建</span></button><button class="nav-button" data-action="search" aria-label="搜索会话">${icon('search')}<span>搜索</span></button></nav>${showSearch?`<div class="search-box"><input type="search" aria-label="按标题搜索会话" placeholder="搜索会话标题" value="${escape(query)}"></div>`:''}<p class="history-label">最近对话</p><div class="sessions" aria-label="会话列表">${sessionList()}</div><div class="sidebar-foot"><button data-action="settings" aria-label="打开设置">${icon('settings')}<span>设置</span></button><span class="local">本机</span></div></aside><main class="main"><header class="topbar"><span class="title">${s?escape(s.title):'新会话'}</span><span class="sample">界面样机 · 不联网</span></header>${s?`<section class="conversation" aria-label="对话内容"><div class="thread">${s.messages.map((m,i)=>m.role==='user'?`<div class="user"><div class="bubble">${escape(m.text)}</div></div>`:`<article class="answer"><div class="answer-body">${m.source?'<h2>采购规则的三个重点</h2><p><strong>1. 超过 800 元，需要审批</strong><br>单笔采购金额超过800元，需要负责人审批。</p><br><p><strong>2. 800 元及以下，无需审批</strong><br>单笔采购金额为800元或更少，无需审批。</p><br><p><strong>3. 报销需要发票</strong><br>报销时必须提供发票。</p><div class="quote">生效日期：2026年11月1日。<br>其他具体流程，演示资料没有说明。</div><button class="source" data-action="document">'+icon('file')+'查看演示资料</button>':escape(m.text)}</div><div class="answer-tools"><button class="icon" data-copy="${i}" aria-label="复制回答">${icon('copy')}</button><span class="demo-text">演示回答</span></div></article>`).join('')}</div></section><footer class="composer-region">${composer}</footer>`:`<section class="welcome"><h1>今天想完成什么？</h1>${composer}<p class="welcome-note">从一个问题，或一份资料开始。</p></section>`}</main>`;
 const view=s?'chat':'new';document.querySelectorAll('[data-view]').forEach(b=>{b.classList.toggle('selected',b.dataset.view===view);b.setAttribute('aria-pressed',b.dataset.view===view)});const url=new URL(location.href);url.searchParams.set('view',view);history.replaceState(null,'',url);
 if(running){const area=document.querySelector('.conversation');area.scrollTop=area.scrollHeight}
}
function stop(){clearInterval(timer);timer=null;running=false;render();document.querySelector('#run-status').textContent='已停止演示 · 已显示的文字保留在本页';notify('已停止演示，保留已显示的文字')}
document.addEventListener('click',event=>{
 const b=event.target.closest('button');if(!b||b.disabled)return;
 if(b.dataset.close){document.querySelector('#'+b.dataset.close).close();return}
 if(b.dataset.view){if(running){notify('请先停止当前演示，再切换页面');return}current=b.dataset.view==='new'?null:sessions[0].id;draft='';render();return}
 if(b.dataset.session){if(running)return;current=Number(b.dataset.session);draft='';render();return}
 let s=sessions.find(s=>s.id===current);
 if(b.dataset.copy){navigator.clipboard.writeText(s.messages[Number(b.dataset.copy)].text).then(()=>notify('已复制演示回答'),()=>notify('此浏览器未允许复制，请直接选择文字'));return}
 const action=b.dataset.action;
 if(action==='settings'||action==='document'){document.querySelector('#'+action).showModal();return}
 if(action==='collapse'){collapsed=!collapsed;render();return}
 if(action==='search'){collapsed=false;showSearch=!showSearch;render();if(showSearch)document.querySelector('input[type=search]').focus();return}
 if(action==='new'){if(running)return;current=null;draft='';hadAttachment=false;render();document.querySelector('textarea').focus();return}
 if(action==='attach'){if(s)s.attachment=true;else hadAttachment=true;render();notify('已添加样机自带的演示资料，没有读取电脑文件');return}
 if(action==='remove'){if(s)s.attachment=false;else hadAttachment=false;render();return}
 if(action==='stop'){stop();return}
 if(action==='send'){
  const text=draft.trim();if(!text||running)return;if(!s){s={id:nextId++,title:text.slice(0,18),messages:[],attachment:hadAttachment};sessions.unshift(s);current=s.id;hadAttachment=false}
  s.messages.push({role:'user',text});const message={role:'assistant',text:''};s.messages.push(message);draft='';query='';running=true;render();
  const response=s.attachment?'这是界面演示，以下为预先准备的文字，并非模型回答。\n\n演示资料写明：800 元及以下无需审批；801 元需要负责人审批；报销时必须提供发票。\n\n正式软件接入后，这里会显示真实回答及资料来源。':'这是界面演示，并非联网生成的回答。\n\n你刚才的消息已显示在上方。这里用预先准备的文字，展示回答逐段出现的效果。\n\n可以点击停止，查看文字保留和输入区恢复的样子；也可以试试会话搜索、附件和设置。';
  let offset=0;timer=setInterval(()=>{offset+=2;message.text=response.slice(0,offset);const bodies=document.querySelectorAll('.answer-body');bodies[bodies.length-1].textContent=message.text;const area=document.querySelector('.conversation');area.scrollTop=area.scrollHeight;if(offset>=response.length){clearInterval(timer);timer=null;running=false;render();document.querySelector('#run-status').textContent='演示已完成 · 内容只保留在本页'}},65);
 }
});
document.addEventListener('input',event=>{if(event.target.matches('textarea')){draft=event.target.value;document.querySelector('[data-action=send]').disabled=!draft.trim()}if(event.target.matches('input[type=search]')){query=event.target.value;document.querySelector('.sessions').innerHTML=sessionList()}});
document.addEventListener('keydown',event=>{if(event.target.matches('textarea')&&event.key==='Enter'&&!event.shiftKey&&!event.isComposing){event.preventDefault();document.querySelector('[data-action=send]')?.click()}});
current=new URLSearchParams(location.search).get('view')==='chat'?1:null;render();
</script></body></html>
