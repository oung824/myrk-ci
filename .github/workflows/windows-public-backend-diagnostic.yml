name: Windows public backend diagnostic

on:
  workflow_dispatch:
    inputs:
      focus:
        description: Run the four reproduced cases, full files, or integrated runner checks
        type: choice
        options: [cases, files, integrated, artifact, auxiliary, file-behavior, isolated-formal, source-only-controls, synthetic-material-parity, synthetic-child-rows, registry-parity]
        default: cases

permissions:
  contents: read

jobs:
  diagnosis:
    if: contains(fromJSON('["cases","files","integrated"]'), inputs.focus)
    name: Diagnose ${{ matrix.name }}
    runs-on: windows-11-arm
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: action-reporting, group: executor-and-network, test_file: test_action_reporting_facts, expected_count: '5'}
          - {name: recovery, group: recovery, test_file: test_recovery, expected_count: '10'}
          - {name: acceptance-actions, group: synthetic-acceptance, test_file: acceptance/test_actions, expected_count: '19'}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the public snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install locked Python dependencies and verify the fixed executor
        run: >-
          & 'C:\Program Files\PowerShell\7\pwsh.exe' -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass
          -File .github/ci/windows-pilot.ps1 -Phase install -Check backend-executor
      - name: Prepare the synthetic report index
        if: matrix.name == 'acceptance-actions'
        run: |
          $index = 'tests/acceptance/materials/history/index.json'
          if (Test-Path -LiteralPath $index) { throw 'Synthetic history must use a new file' }
          New-Item -ItemType Directory -Path (Split-Path -Parent $index) -Force -ErrorAction Stop | Out-Null
          Copy-Item -LiteralPath '.github/ci/fixtures/empty-acceptance-history.json' -Destination $index
      - name: Run the selected file and report safe failure locations
        env:
          MYRK_DIAGNOSTIC_GROUP: ${{ matrix.group }}
          MYRK_DIAGNOSTIC_FILE: ${{ matrix.test_file }}
          MYRK_DIAGNOSTIC_FOCUS: ${{ inputs.focus }}
          MYRK_DIAGNOSTIC_COUNT: ${{ matrix.expected_count }}
        run: |
          $options = @()
          if ($env:MYRK_DIAGNOSTIC_FOCUS -eq 'cases') { $options += '--failed-cases-only' }
          if ($env:MYRK_DIAGNOSTIC_FOCUS -eq 'integrated') { $options += @('--expected-count', $env:MYRK_DIAGNOSTIC_COUNT) }
          & '.venv/Scripts/python.exe' -B '.github/ci/windows-public-backend.py' $env:MYRK_DIAGNOSTIC_GROUP --diagnostic-file $env:MYRK_DIAGNOSTIC_FILE @options
          exit $LASTEXITCODE

  integrated-runner:
    name: Check integrated runner ${{ matrix.scope }}
    if: inputs.focus == 'integrated'
    runs-on: windows-2025
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        scope: [scheduling, receipts]
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the public snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up x64 Node.js for desktop receipt tests
        if: matrix.scope == 'receipts'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.20.0'
          architecture: x64
          package-manager-cache: false
      - name: Install locked Python dependencies
        run: >-
          & 'C:\Program Files\PowerShell\7\pwsh.exe' -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass
          -File .github/ci/windows-pilot.ps1 -Phase install -Check backend-public
      - name: Collect and run the selected runner tests
        env:
          MYRK_RUNNER_SCOPE: ${{ matrix.scope }}
        run: |
          & '.venv/Scripts/python.exe' -B '.github/ci/windows-public-backend.py' "integrated-runner-$env:MYRK_RUNNER_SCOPE"
          exit $LASTEXITCODE

  artifact:
    name: Verify artifact delivery on Windows ARM
    if: inputs.focus == 'artifact'
    runs-on: windows-11-arm
    timeout-minutes: 12
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the public snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install locked Python dependencies and verify the fixed executor
        run: >-
          & 'C:\Program Files\PowerShell\7\pwsh.exe' -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass
          -File .github/ci/windows-pilot.ps1 -Phase install -Check backend-executor
      - name: Run the selected file and report safe failure locations
        run: |
          $diagnose = @'
          import runpy
          import sys

          path = ".github/ci/windows-public-backend.py"
          driver = runpy.run_path(path)
          driver["DIAGNOSTIC_FILES"]["test_artifacts"] = "artifact-delivery"
          sys.argv = [
              path, "artifact-delivery", "--diagnostic-file", "test_artifacts",
              "--expected-count", "24",
              "--expected-node-digest", "bbb187bc32cfa39424c45c039322fff1c4e2b17b220e3f1f79b6d393340449e1",
          ]
          sys.exit(driver["main"]())
          '@
          $diagnose | & '.venv/Scripts/python.exe' -B -
          exit $LASTEXITCODE

  auxiliary:
    name: Acceptance ${{ matrix.group }}
    if: inputs.focus == 'auxiliary'
    runs-on: windows-11-arm
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {group: qualified-adoption, count: '25', digest: '73bcec92636f1fa23f36df46915ede291e5e053d7364277ef17df306fcafeeb0', electron: false}
          - {group: provider-mocks, count: '20', digest: 'e9705be10799fd798cd36f3da85edfec9910ce1da05afbbd2819d64d71ed16c0', electron: false}
          - {group: provider-electron, count: '1', digest: '2f3ae1f17c3f6871214e2d6d5666e029ee7acd058733d8b8fc32de995f2c45d2', electron: true}
          - {group: resume-mocks, count: '18', digest: 'd207cb8e430d3373f33e3d2f843d965a5beb4ed9363736557e582fddc88b34bc', electron: false}
          - {group: resume-electron, count: '1', digest: '3f4e2ed7561d5b25e50272ff2238318802044675e06585427ae41156768644b8', electron: true}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the public snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up x64 Node.js
        if: matrix.electron
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.20.0'
          architecture: x64
          package-manager-cache: false
      - name: Install locked Python dependencies and verify the fixed executor
        run: >-
          & 'C:\Program Files\PowerShell\7\pwsh.exe' -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass
          -File .github/ci/windows-pilot.ps1 -Phase install -Check backend-executor
      - name: Install locked desktop dependencies and Electron
        if: matrix.electron
        run: >-
          & 'C:\Program Files\PowerShell\7\pwsh.exe' -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass
          -File .github/ci/windows-pilot.ps1 -Phase install -Check typescript-types
      - name: Prepare isolated synthetic registrations
        env:
          MYRK_AUX_GROUP: ${{ matrix.group }}
        run: |
          $history = 'tests/acceptance/materials/history'
          if (Test-Path -LiteralPath "$history/index.json") { throw 'Synthetic history requires an empty checkout' }
          New-Item -ItemType Directory -Path $history -Force -ErrorAction Stop | Out-Null
          Copy-Item -LiteralPath '.github/ci/fixtures/empty-acceptance-history.json' -Destination "$history/index.json"
          if ($env:MYRK_AUX_GROUP.StartsWith('provider-')) {
            $catalogue = 'tests/acceptance/materials/connection-desktop'
            if (-not (Test-Path -LiteralPath $catalogue)) {
              New-Item -ItemType Directory -Path $catalogue -ErrorAction Stop | Out-Null
            }
          }
      - name: Verify the exact selected offline tests
        env:
          MYRK_AUX_GROUP: ${{ matrix.group }}
          MYRK_AUX_COUNT: ${{ matrix.count }}
          MYRK_AUX_DIGEST: ${{ matrix.digest }}
        run: |
          & '.venv/Scripts/python.exe' -B '.github/ci/windows-public-auxiliary.py' $env:MYRK_AUX_GROUP $env:MYRK_AUX_COUNT $env:MYRK_AUX_DIGEST
          exit $LASTEXITCODE

  file-behavior:
    name: Offline behavior ${{ matrix.group }}
    if: inputs.focus == 'file-behavior'
    runs-on: windows-11-arm
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        group: [file-receipts, file-effects-and-decimal, file-command-effects, approval-authorization, approval-stop-and-readonly]
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the public snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install locked Python dependencies and verify the fixed executor
        run: >-
          & 'C:\Program Files\PowerShell\7\pwsh.exe' -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass
          -File .github/ci/windows-pilot.ps1 -Phase install -Check backend-executor
      - name: Prepare the synthetic report index
        run: |
          $index = 'tests/acceptance/materials/history/index.json'
          if (Test-Path -LiteralPath $index) { throw 'Synthetic history must use a new file' }
          New-Item -ItemType Directory -Path (Split-Path -Parent $index) -Force -ErrorAction Stop | Out-Null
          Copy-Item -LiteralPath '.github/ci/fixtures/empty-acceptance-history.json' -Destination $index
      - name: Verify exact offline behavior and recovery
        env:
          MYRK_CI_SPLIT_GROUP: ${{ matrix.group }}
        run: |
          & '.venv/Scripts/python.exe' -B '.github/ci/windows-public-split-file-behavior.py' $env:MYRK_CI_SPLIT_GROUP
          exit $LASTEXITCODE

  isolated-formal:
    name: Formal behavior ${{ matrix.scope }}
    if: inputs.focus == 'isolated-formal'
    runs-on: windows-11-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        scope: [formal-unit-score, formal-unit-receipts, formal-locked-stop]
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the public snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install locked Python and the fixed executor
        run: >-
          & 'C:\Program Files\PowerShell\7\pwsh.exe' -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass
          -File .github/ci/windows-pilot.ps1 -Phase install -Check backend-executor
      - name: Prepare synthetic collection and report indexes
        run: |
          $materials = 'tests/acceptance/materials'
          if ((Test-Path "$materials/catalogue/required.json") -or (Test-Path "$materials/history/index.json")) {
            throw 'Expected new fixture paths'
          }
          New-Item -ItemType Directory -Path "$materials/history","$materials/catalogue" -Force -ErrorAction Stop | Out-Null
          Set-Content -LiteralPath "$materials/catalogue/required.json" -Value '{}' -Encoding utf8
          Copy-Item -LiteralPath '.github/ci/fixtures/empty-acceptance-history.json' -Destination "$materials/history/index.json"
      - name: Run exact isolated formal assertions
        env:
          MYRK_FORMAL_SCOPE: ${{ matrix.scope }}
        run: |
          & '.venv/Scripts/python.exe' -B '.github/ci/windows-isolated-formal.py' $env:MYRK_FORMAL_SCOPE
          exit $LASTEXITCODE

  source-only-controls:
    name: Source-only control ${{ matrix.group }}
    if: inputs.focus == 'source-only-controls'
    runs-on: windows-11-arm
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - {group: ordinary-protocols, count: '1', digest: 'f1f8e8f5679c7b5ccb2ffe781252d831d1dd22c36f22a9c1a220e8a4d172ffc6'}
          - {group: delegated-recovery-shape, count: '2', digest: '57635c61a1bf5a8f4f6dc3ca09ed2bcf8b473672c6c45e5fadccc136e7c774e1'}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the public snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install locked Python and the fixed executor
        run: >-
          & 'C:\Program Files\PowerShell\7\pwsh.exe' -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass
          -File .github/ci/windows-pilot.ps1 -Phase install -Check backend-executor
      - name: Verify exact source-only controls
        env:
          MYRK_CI_SOURCE_GROUP: ${{ matrix.group }}
          MYRK_CI_SOURCE_COUNT: ${{ matrix.count }}
          MYRK_CI_SOURCE_DIGEST: ${{ matrix.digest }}
        run: |
          & '.venv/Scripts/python.exe' -B '.github/ci/windows-public-source-only-controls.py' $env:MYRK_CI_SOURCE_GROUP $env:MYRK_CI_SOURCE_COUNT $env:MYRK_CI_SOURCE_DIGEST
          exit $LASTEXITCODE

  synthetic-material-parity:
    name: Synthetic material parity ${{ matrix.group }}
    if: inputs.focus == 'synthetic-material-parity' || inputs.focus == 'synthetic-child-rows'
    runs-on: windows-11-arm
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(inputs.focus == 'synthetic-child-rows' && '["governance-child-rows"]' || '["governance-refusal","governance-action-identity","governance-measurement-limit","governance-child-rows","memory-save-rejection"]') }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the public snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install locked Python and the fixed executor
        run: >-
          & 'C:\Program Files\PowerShell\7\pwsh.exe' -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass
          -File .github/ci/windows-pilot.ps1 -Phase install -Check backend-executor
      - name: Verify unchanged assertions with generated inputs
        env:
          MYRK_CI_PARITY_GROUP: ${{ matrix.group }}
        run: |
          & '.venv/Scripts/python.exe' -B '.github/ci/windows-public-synthetic-parity.py' $env:MYRK_CI_PARITY_GROUP
          exit $LASTEXITCODE

  registry-parity:
    name: Public registry behavior ${{ matrix.group }}
    if: inputs.focus == 'registry-parity'
    runs-on: windows-11-arm
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        group: [historical-cli-report, caller-only-readiness]
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the public snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install locked Python and the fixed executor
        run: >-
          & 'C:\Program Files\PowerShell\7\pwsh.exe' -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass
          -File .github/ci/windows-pilot.ps1 -Phase install -Check backend-executor
      - name: Verify history CLI and caller-only readiness
        env:
          MYRK_CI_REGISTRY_PARITY: ${{ matrix.group }}
        run: |
          & '.venv/Scripts/python.exe' -B '.github/ci/windows-public-registry-parity.py' $env:MYRK_CI_REGISTRY_PARITY
          exit $LASTEXITCODE
