name: Windows public offline judge

on:
  workflow_dispatch:
    inputs:
      focus:
        description: Run both synthetic checks or diagnose only the native SDK case
        type: choice
        options: [all, native, synthetic-artifacts, quality-recovery, split-ordinary, split-ordinary-controls]
        default: all

permissions:
  contents: read

jobs:
  judge:
    if: inputs.focus == 'all' || inputs.focus == 'native'
    runs-on: windows-11-arm
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the public snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install locked Python dependencies and verify the fixed executor
        run: >-
          & 'C:\Program Files\PowerShell\7\pwsh.exe' -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass
          -File .github/ci/windows-pilot.ps1 -Phase install -Check backend-executor
      - name: Prepare the synthetic report index
        run: |
          $index = 'tests/acceptance/materials/history/index.json'
          if (Test-Path -LiteralPath $index) { throw 'Synthetic history must use a new file' }
          New-Item -ItemType Directory -Path (Split-Path -Parent $index) -Force -ErrorAction Stop | Out-Null
          Copy-Item -LiteralPath '.github/ci/fixtures/empty-acceptance-history.json' -Destination $index
      - name: Run the synthetic ledger and native SDK judge tests
        env:
          MYRK_CI_JUDGE_FOCUS: ${{ inputs.focus }}
        run: |
          $options = @()
          if ($env:MYRK_CI_JUDGE_FOCUS -eq 'native') { $options += '--native-only' }
          & '.venv/Scripts/python.exe' -B '.github/ci/windows-public-backend.py' judge-fixtures @options
          exit $LASTEXITCODE

  synthetic-artifacts:
    name: Acceptance ${{ matrix.group }} materials
    if: inputs.focus == 'synthetic-artifacts'
    runs-on: windows-11-arm
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {group: audited-compaction-fixtures, count: '21', digest: '9b0bd754f6d2b08f746e58ddaf0e57ea83d66cf9b21a0c2429ae2811fe1dc9ef'}
          - {group: audited-delegation-fixtures, count: '9', digest: 'afec2f4f3b2fabc4ea3c2d7593ab8f2e3858b95e9ad63af1a54814181d49eb10'}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the public snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install locked Python dependencies and verify the fixed executor
        run: >-
          & 'C:\Program Files\PowerShell\7\pwsh.exe' -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass
          -File .github/ci/windows-pilot.ps1 -Phase install -Check backend-executor
      - name: Prepare the synthetic report index
        run: |
          $index = 'tests/acceptance/materials/history/index.json'
          if (Test-Path -LiteralPath $index) { throw 'Synthetic history must use a new file' }
          New-Item -ItemType Directory -Path (Split-Path -Parent $index) -Force -ErrorAction Stop | Out-Null
          Copy-Item -LiteralPath '.github/ci/fixtures/empty-acceptance-history.json' -Destination $index
      - name: Verify the complete synthetic materials
        env:
          MYRK_GROUP: ${{ matrix.group }}
          MYRK_COUNT: ${{ matrix.count }}
          MYRK_DIGEST: ${{ matrix.digest }}
        run: |
          $verify = @'
          import os
          import runpy
          import sys

          driver = ".github/ci/windows-public-backend.py"
          scope = os.environ["MYRK_GROUP"]
          backend = runpy.run_path(driver)
          backend["AUDITED_SELECTION"][scope] = backend["AUDITED_DESELECT"].pop(scope)
          sys.argv = [driver, scope, "--expected-count", os.environ["MYRK_COUNT"],
                      "--expected-node-digest", os.environ["MYRK_DIGEST"]]
          sys.exit(backend["main"]())
          '@
          $verify | & '.venv/Scripts/python.exe' -B -
          exit $LASTEXITCODE

  quality-recovery:
    name: Verify ${{ matrix.group }}
    if: inputs.focus == 'quality-recovery'
    runs-on: windows-11-arm
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {group: recovery-controls, count: '21', digest: '38d809592c198800dab7e2c5a3bd1e86bbb0abae859c1688787d9274b81621bf'}
          - {group: resume-controls, count: '20', digest: 'f207091bb40640a5a2a8aed4b28fd4976c33535d65126eaff4df1fc2464182f7'}
          - {group: terminal-projection, count: '1', digest: 'b48f02ccb6690f0125b7676c874fd9c7cd6afea3e9542eb34165bd3863f63dfd'}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the public snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install locked Python dependencies and verify the fixed executor
        run: >-
          & 'C:\Program Files\PowerShell\7\pwsh.exe' -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass
          -File .github/ci/windows-pilot.ps1 -Phase install -Check backend-executor
      - name: Prepare the synthetic report index
        run: |
          $index = 'tests/acceptance/materials/history/index.json'
          if (Test-Path -LiteralPath $index) { throw 'Synthetic history must use a new file' }
          New-Item -ItemType Directory -Path (Split-Path -Parent $index) -Force -ErrorAction Stop | Out-Null
          Copy-Item -LiteralPath '.github/ci/fixtures/empty-acceptance-history.json' -Destination $index
      - name: Run the selected synthetic tests
        env:
          MYRK_GROUP: ${{ matrix.group }}
          MYRK_COUNT: ${{ matrix.count }}
          MYRK_DIGEST: ${{ matrix.digest }}
        run: |
          & '.venv/Scripts/python.exe' -B '.github/ci/windows-public-quality-recovery.py' $env:MYRK_GROUP $env:MYRK_COUNT $env:MYRK_DIGEST
          exit $LASTEXITCODE

  split-ordinary:
    name: Behavior ${{ matrix.group }}
    if: inputs.focus == 'split-ordinary' || inputs.focus == 'split-ordinary-controls'
    runs-on: windows-11-arm
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        group: >-
          ${{ fromJSON(inputs.focus == 'split-ordinary-controls' &&
          '["split-ordinary-billing-1","split-ordinary-billing-2","split-ordinary-guards-1","split-ordinary-guards-2","split-ordinary-entry-controls","split-ordinary-synthetic-forms"]' ||
          '["split-ordinary-1","split-ordinary-2","split-ordinary-3","split-ordinary-4"]') }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the published sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the locked Python runtime and executor
        run: >-
          & 'C:\Program Files\PowerShell\7\pwsh.exe' -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass
          -File .github/ci/windows-pilot.ps1 -Phase install -Check backend-executor
      - name: Create a synthetic report index
        run: |
          $index = 'tests/acceptance/materials/history/index.json'
          if (Test-Path -LiteralPath $index) { throw 'A new synthetic history is required' }
          New-Item -ItemType Directory -Path (Split-Path -Parent $index) -Force -ErrorAction Stop | Out-Null
          Copy-Item -LiteralPath '.github/ci/fixtures/empty-acceptance-history.json' -Destination $index
      - name: Run unchanged assertions with the ordinary registry fixture
        env:
          MYRK_BEHAVIOR_GROUP: ${{ matrix.group }}
        run: |
          & '.venv/Scripts/python.exe' -B '.github/ci/windows-public-split-behavior.py' $env:MYRK_BEHAVIOR_GROUP
          exit $LASTEXITCODE
