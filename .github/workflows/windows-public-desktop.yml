name: Windows public offline desktop

on:
  workflow_dispatch:
    inputs:
      focus:
        description: Scope for the offline desktop check
        type: choice
        options: [all, renderer-and-state, process-workflows, isolated-process-files, recovery-and-approval]
        default: all

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop ${{ matrix.group }}
    runs-on: windows-11-arm
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        group: >-
          ${{ fromJSON(inputs.focus == 'renderer-and-state' && '["renderer-and-state"]' ||
          inputs.focus == 'process-workflows' && '["electron-workflows","python-service","diagnose-index","diagnose-lifecycle","diagnose-exit-acceptance"]' ||
          inputs.focus == 'recovery-and-approval' && '["diagnose-recovery","diagnose-approval-modes"]' ||
          inputs.focus == 'isolated-process-files' && '["diagnose-index","diagnose-lifecycle","diagnose-exit-acceptance"]' ||
          '["electron-workflows","python-service","renderer-and-state","pdf-and-programming","diagnose-index","diagnose-lifecycle","diagnose-exit-acceptance"]') }}
    env:
      MYRK_CI_DESKTOP_GROUP: ${{ matrix.group }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the public snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up x64 Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.20.0'
          architecture: x64
          package-manager-cache: false
      - name: Install locked Python dependencies and the fixed executor
        run: >-
          & 'C:\Program Files\PowerShell\7\pwsh.exe' -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass
          -File .github/ci/windows-pilot.ps1 -Phase install -Check backend-executor
      - name: Install locked desktop dependencies and Electron
        run: >-
          & 'C:\Program Files\PowerShell\7\pwsh.exe' -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass
          -File .github/ci/windows-pilot.ps1 -Phase install -Check typescript-types
      - name: Build and check the selected offline desktop behavior
        run: >-
          & 'C:\Program Files\PowerShell\7\pwsh.exe' -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass
          -File .github/ci/windows-public-desktop.ps1 -Group $env:MYRK_CI_DESKTOP_GROUP
