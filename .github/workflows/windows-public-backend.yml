name: Windows public offline backend

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend ${{ matrix.group }}
    runs-on: windows-2025
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        group: [records-and-context, compaction-and-budget, model-protocols, desktop-service, check-resources]
    env:
      MYRK_CI_GROUP: ${{ matrix.group }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the public snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install locked Python dependencies
        run: >-
          & 'C:\Program Files\PowerShell\7\pwsh.exe' -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass
          -File .github/ci/windows-pilot.ps1 -Phase install -Check backend-public
      - name: Collect and run the selected offline tests
        run: |
          & '.venv/Scripts/python.exe' -B '.github/ci/windows-public-backend.py' $env:MYRK_CI_GROUP
          exit $LASTEXITCODE
