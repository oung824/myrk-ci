          MYRK_CI_COUNT: ${{ matrix.expected_count }}
          MYRK_CI_NODE_DIGEST: ${{ matrix.node_digest }}
        run: |
          & '.venv/Scripts/python.exe' -B '.github/ci/windows-public-backend.py' $env:MYRK_CI_ACCEPTANCE_GROUP --expected-count $env:MYRK_CI_COUNT --expected-node-digest $env:MYRK_CI_NODE_DIGEST
          exit $LASTEXITCODE

  integrated-source-controls:
    name: Acceptance ${{ matrix.group }}
    if: inputs.focus == 'integrated-source-controls'
    runs-on: windows-11-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {group: audited-candidate-controls, expected_count: '15', node_digest: '318a9fb49501c66c1cd414a2d78c3c98ef1fb61af25a8d61af7d2f2e3962b012', node: false}
          - {group: audited-sdk-reopen, expected_count: '2', node_digest: '33c50a3cfdf9aaec86d9685a1d15d18076ae1c84f8d42b136301613b742aa3fd', node: false}
          - {group: audited-governance-stop-control, expected_count: '5', node_digest: 'ce8b63d2edada47a3e59d7ee53c497a61a2814469785d49c0aeb1606dfaefbde', node: true}
          - {group: audited-quality-materials-4, expected_count: '11', node_digest: '5612079ef4acc8621502aa0a9358aa37b6f71375ddd6a764581db902c685f13b', node: false}
    defaults:
      run:
        shell: pwsh
    steps:
