          MYRK_CI_ACCEPTANCE_GROUP: audited-packet-stage-retry
          MYRK_CI_COUNT: '1'
          MYRK_CI_NODE_DIGEST: 6eb0346f1070e40d12bb5a2b8bd3e072a0104ac6048838b32a55484b1baff993
