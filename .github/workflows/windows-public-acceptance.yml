name: Windows public synthetic acceptance

on:
  workflow_dispatch:
    inputs:
      focus:
        description: Scope of the synthetic acceptance run
        type: choice
        options: [all, additional, initial, local-scoring, question-review, delegation-compaction, integrated-fixtures, integrated-synthetic-controls, integrated-synthetic-materials, integrated-source-controls, integrated-runtime-controls, integrated-runtime-retry, integrated-shutdown-behavior]
        default: all

permissions:
  contents: read

jobs:
  acceptance:
    name: Acceptance ${{ matrix.group }}
    if: inputs.focus != 'integrated-fixtures' && inputs.focus != 'integrated-synthetic-controls' && inputs.focus != 'integrated-synthetic-materials' && inputs.focus != 'integrated-source-controls' && inputs.focus != 'integrated-runtime-controls' && inputs.focus != 'integrated-runtime-retry' && inputs.focus != 'integrated-shutdown-behavior'
    runs-on: windows-11-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        group: >-
          ${{ fromJSON(inputs.focus == 'additional' &&
          '["synthetic-quality","synthetic-judge-qualification","synthetic-trust-and-memory","synthetic-review-and-cancellation"]' ||
          inputs.focus == 'initial' && '["synthetic-acceptance"]' ||
          inputs.focus == 'local-scoring' && '["synthetic-local-scoring"]' ||
          inputs.focus == 'question-review' && '["synthetic-question-review"]' ||
          inputs.focus == 'delegation-compaction' && '["synthetic-delegation","synthetic-compaction"]' ||
          '["synthetic-acceptance","synthetic-quality","synthetic-judge-qualification","synthetic-trust-and-memory",
          "synthetic-review-and-cancellation","synthetic-local-scoring","synthetic-question-review",
          "synthetic-delegation","synthetic-compaction"]') }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the public snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install locked Python dependencies and verify the fixed executor
        run: >-
          & 'C:\Program Files\PowerShell\7\pwsh.exe' -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass
          -File .github/ci/windows-pilot.ps1 -Phase install -Check backend-executor
      - name: Prepare the synthetic report index
        run: |
          $index = 'tests/acceptance/materials/history/index.json'
          if (Test-Path -LiteralPath $index) { throw 'Synthetic history must use a new file' }
          New-Item -ItemType Directory -Path (Split-Path -Parent $index) -Force -ErrorAction Stop | Out-Null
          Copy-Item -LiteralPath '.github/ci/fixtures/empty-acceptance-history.json' -Destination $index
      - name: Run the public synthetic tests
        env:
          MYRK_CI_ACCEPTANCE_GROUP: ${{ matrix.group }}
        run: |
          & '.venv/Scripts/python.exe' -B '.github/ci/windows-public-backend.py' $env:MYRK_CI_ACCEPTANCE_GROUP
          exit $LASTEXITCODE

  integrated-fixtures:
    name: Acceptance ${{ matrix.group }}
    if: inputs.focus == 'integrated-fixtures'
    runs-on: windows-11-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {group: audited-delegation-fixtures, expected_count: '44', node_digest: '22a8e8098140d048d305a3d465511869f31f8a042856c0e7ccffc9725b6454eb'}
          - {group: audited-compaction-fixtures, expected_count: '28', node_digest: 'a0139696920881e9f42ede06d77585b731e3aaedb6b57118d1ac2af918a92b16'}
          - {group: audited-native-fixtures, expected_count: '20', node_digest: '82c6a70a02a6b03b1bb6db18386a6f542e4042b10cde38e76999ab6aef9aea8a'}
          - {group: audited-review-fixtures, expected_count: '24', node_digest: 'de33a928840a47c316e8fc709fa8239b6a897445e51e6036a71424baff25dd53'}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the public snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install locked Python dependencies and verify the fixed executor
        run: >-
          & 'C:\Program Files\PowerShell\7\pwsh.exe' -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass
          -File .github/ci/windows-pilot.ps1 -Phase install -Check backend-executor
      - name: Prepare the synthetic fixture catalogue
        env:
          MYRK_CI_ACCEPTANCE_GROUP: ${{ matrix.group }}
        run: |
          $index = 'tests/acceptance/materials/history/index.json'
          if (Test-Path -LiteralPath $index) { throw 'Synthetic history must use a new file' }
          New-Item -ItemType Directory -Path (Split-Path -Parent $index) -Force -ErrorAction Stop | Out-Null
          Copy-Item -LiteralPath '.github/ci/fixtures/empty-acceptance-history.json' -Destination $index
          if ($env:MYRK_CI_ACCEPTANCE_GROUP -eq 'audited-delegation-fixtures') {
            $delegation = 'tests/acceptance/materials/delegation'
            if (-not (Test-Path -LiteralPath $delegation)) {
              New-Item -ItemType Directory -Path $delegation -ErrorAction Stop | Out-Null
            }
          }
          if ($env:MYRK_CI_ACCEPTANCE_GROUP -eq 'audited-compaction-fixtures') {
            $compaction = 'tests/acceptance/materials/compaction/inputs.json'
            if (-not (Test-Path -LiteralPath $compaction)) {
              Set-Content -LiteralPath $compaction -Value '{}' -Encoding utf8NoBOM -ErrorAction Stop
            }
          }
      - name: Verify the audited manifest and run the selected synthetic tests
        env:
          MYRK_CI_ACCEPTANCE_GROUP: ${{ matrix.group }}
          MYRK_CI_COUNT: ${{ matrix.expected_count }}
          MYRK_CI_NODE_DIGEST: ${{ matrix.node_digest }}
        run: |
          & '.venv/Scripts/python.exe' -B '.github/ci/windows-public-backend.py' $env:MYRK_CI_ACCEPTANCE_GROUP --expected-count $env:MYRK_CI_COUNT --expected-node-digest $env:MYRK_CI_NODE_DIGEST
          exit $LASTEXITCODE

  integrated-synthetic-controls:
    name: Acceptance ${{ matrix.group }}
    if: inputs.focus == 'integrated-synthetic-controls'
    runs-on: windows-11-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {group: audited-integration-controls, expected_count: '46', node_digest: 'f2559fe4746b9a2e16050cca636842e17a65a684c020192bcc3d52c574d158c0'}
          - {group: audited-formal-http-controls, expected_count: '12', node_digest: 'dd2e1813a0f6da17788e6855614c75d47baf0572fd05fbe609ef7595894c0a51'}
          - {group: audited-historical-controls, expected_count: '26', node_digest: '480fa1ae189a12c3dfdc7a01b8c18fc7ff7cc2b49231aae7d2664221a59ba2d6'}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the public snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install locked Python dependencies and verify the fixed executor
        run: >-
          & 'C:\Program Files\PowerShell\7\pwsh.exe' -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass
          -File .github/ci/windows-pilot.ps1 -Phase install -Check backend-executor
      - name: Prepare the synthetic report index
        run: |
          $index = 'tests/acceptance/materials/history/index.json'
          if (Test-Path -LiteralPath $index) { throw 'Synthetic history must use a new file' }
          New-Item -ItemType Directory -Path (Split-Path -Parent $index) -Force -ErrorAction Stop | Out-Null
          Copy-Item -LiteralPath '.github/ci/fixtures/empty-acceptance-history.json' -Destination $index
      - name: Verify the audited manifest and run the selected synthetic tests
        env:
          MYRK_CI_ACCEPTANCE_GROUP: ${{ matrix.group }}
          MYRK_CI_COUNT: ${{ matrix.expected_count }}
          MYRK_CI_NODE_DIGEST: ${{ matrix.node_digest }}
        run: |
          & '.venv/Scripts/python.exe' -B '.github/ci/windows-public-backend.py' $env:MYRK_CI_ACCEPTANCE_GROUP --expected-count $env:MYRK_CI_COUNT --expected-node-digest $env:MYRK_CI_NODE_DIGEST
          exit $LASTEXITCODE

  integrated-synthetic-materials:
    name: Acceptance ${{ matrix.group }}
    if: inputs.focus == 'integrated-synthetic-materials'
    runs-on: windows-11-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {group: audited-memory-criteria, expected_count: '4', node_digest: '779b21bad6e4fac3ab3323c3ae614f32e4f1dedfcb987bddf9e7db07d939dfa5'}
          - {group: audited-quality-materials-1, expected_count: '4', node_digest: '7b66b3ad9c69b399d80613fd5d91dc1f2d589bafedca67e59674baac2c536621'}
          - {group: audited-quality-materials-2, expected_count: '4', node_digest: '5418b204920be0f3444ef766572a6b8936d13a8b664c413d4651d4b6987b73b1'}
          - {group: audited-quality-materials-3, expected_count: '4', node_digest: '9ea55ad556c7e1d7b4b417364d688253ea7d45c595ce80413ef74cd39273a7b0'}
          - {group: audited-quality-materials-4, expected_count: '11', node_digest: '5612079ef4acc8621502aa0a9358aa37b6f71375ddd6a764581db902c685f13b'}
          - {group: audited-quality-materials-5, expected_count: '11', node_digest: 'bab7d3dfdbd211febd1f49bd6591006dc23631ffc586c807496ecb93e38e5c59'}
          - {group: audited-quality-materials-6, expected_count: '11', node_digest: 'ffd602ac60f54d11e0f585d7eea1423f36c2f74d97566ac565e34fa7954eb1c9'}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the public snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install locked Python dependencies and verify the fixed executor
        run: >-
          & 'C:\Program Files\PowerShell\7\pwsh.exe' -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass
          -File .github/ci/windows-pilot.ps1 -Phase install -Check backend-executor
      - name: Prepare the synthetic report index
        run: |
          if (Test-Path -LiteralPath '.scratch/quality-material-usage') { throw 'Quality tests require a new runner-local authority' }
          $index = 'tests/acceptance/materials/history/index.json'
          if (Test-Path -LiteralPath $index) { throw 'Synthetic history must use a new file' }
          New-Item -ItemType Directory -Path (Split-Path -Parent $index) -Force -ErrorAction Stop | Out-Null
          Copy-Item -LiteralPath '.github/ci/fixtures/empty-acceptance-history.json' -Destination $index
