name: Windows public offline backend expansion

on:
  workflow_dispatch:
    inputs:
      focus:
        description: Scope of the backend expansion
        type: choice
        options: [all, artifact-delivery]
        default: all

permissions:
  contents: read

jobs:
  backend:
    name: Backend ${{ matrix.group }}
    runs-on: ${{ contains(fromJSON('["process-and-scheduling","root-git-hooks"]'), matrix.group) && 'windows-2025' || 'windows-11-arm' }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        group: >-
          ${{ fromJSON(inputs.focus == 'artifact-delivery' && '["artifact-delivery"]' ||
          '["process-and-scheduling","root-git-hooks","executor-and-network","serial-checks","action-approval",
          "artifact-delivery","conversation-and-delegation","desktop-conversation","recovery",
          "retained-context","provider-transcripts","request-protocols","review-evidence"]') }}
    env:
      MYRK_CI_GROUP: ${{ matrix.group }}
      MYRK_CI_INSTALLER: ${{ contains(fromJSON('["process-and-scheduling","root-git-hooks"]'), matrix.group) && 'backend-public' || 'backend-executor' }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the public snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install locked Python dependencies
        run: >-
          & 'C:\Program Files\PowerShell\7\pwsh.exe' -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass
          -File .github/ci/windows-pilot.ps1 -Phase install -Check $env:MYRK_CI_INSTALLER
      - name: Collect and run the selected offline tests
        run: |
          & '.venv/Scripts/python.exe' -B '.github/ci/windows-public-backend.py' $env:MYRK_CI_GROUP
          exit $LASTEXITCODE
