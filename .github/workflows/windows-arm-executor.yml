name: Windows 11 ARM executor probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  executor:
    runs-on: windows-11-arm
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the reviewed snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the fixed x64 Python and executor
        run: >-
          & 'C:\Program Files\PowerShell\7\pwsh.exe' -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass
          -File .github/ci/windows-pilot.ps1 -Phase install -Check backend-executor
      - name: Validate restricted execution and complete output
        run: >-
          & 'C:\Program Files\PowerShell\7\pwsh.exe' -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass
          -File .github/ci/windows-pilot.ps1 -Phase check -Check backend-executor
