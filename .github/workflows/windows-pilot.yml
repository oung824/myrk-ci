name: Windows offline pilot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: python-types
            name: Backend type check
            runtime: python
            runner: windows-2025
          - check: typescript-types
            name: Desktop type check
            runtime: node
            runner: windows-2025
    env:
      MYRK_PILOT_CHECK: ${{ matrix.check }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the pilot snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        if: matrix.runtime == 'node'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.20.0'
          architecture: x64
          package-manager-cache: false
      - name: Install locked project dependencies
        run: >-
          & 'C:\Program Files\PowerShell\7\pwsh.exe' -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass
          -File .github/ci/windows-pilot.ps1 -Phase install -Check $env:MYRK_PILOT_CHECK
      - name: Run the selected check
        run: >-
          & 'C:\Program Files\PowerShell\7\pwsh.exe' -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass
          -File .github/ci/windows-pilot.ps1 -Phase check -Check $env:MYRK_PILOT_CHECK
